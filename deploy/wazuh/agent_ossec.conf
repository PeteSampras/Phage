<!--
  Add inside <ossec_config> on each Phage host's Wazuh agent
  (/var/ossec/etc/ossec.conf), or in a centralized agent.conf group. Commands
  in a centralized agent.conf need logcollector.remote_commands=1 in the
  agent's local_internal_options.conf.

  Install the check first:
    install -m 0755 deploy/wazuh/phage-heartbeat-check /usr/local/lib/phage/

  The agent ships novelty.jsonl to the SIEM whatever its rows' TLP label:
  the label travels in each row, Wazuh does not enforce it.

  The check's 180 is three heartbeat intervals (output.heartbeat_interval,
  default 60 s); scale it with the interval.
-->
<localfile>
  <log_format>json</log_format>
  <location>/var/lib/phage/audit.jsonl</location>
</localfile>

<localfile>
  <log_format>json</log_format>
  <location>/var/lib/phage/novelty.jsonl</location>
</localfile>

<localfile>
  <log_format>command</log_format>
  <command>/usr/local/lib/phage/phage-heartbeat-check 180</command>
  <alias>phage-heartbeat</alias>
  <frequency>60</frequency>
</localfile>

<localfile>
  <log_format>command</log_format>
  <command>systemctl is-active phage.service</command>
  <alias>phage-service</alias>
  <frequency>60</frequency>
</localfile>
