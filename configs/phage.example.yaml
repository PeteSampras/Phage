# Phage daemon configuration (example).
# Copy to /etc/phage/phage.yaml and adjust. Comments explain the trade-offs.

# Operating posture. The ladder is learn -> alert -> enforce.
# NEVER start a fresh install in enforce: the baseline is empty and everything
# looks anomalous. See docs/concepts/modes.md.
mode: learn

# Where the learned baseline is persisted (JSON on disk). Survives restarts.
state_path: /var/lib/phage/baseline.json

# Minimum time to stay in learn mode before alert/enforce is advisable.
# A week captures weekly cron and maintenance patterns.
learn_window: 168h

log_level: info

# Response thresholds, 0.0 (normal) .. 1.0 (certainly anomalous).
# Tune aggressiveness here instead of in code.
thresholds:
  notify: 0.4   # at/above this score, raise an alert
  contain: 0.8  # at/above this score, contain (enforce mode + an armed enforcement feature only)

# Append-only JSON-lines audit trail (created 0600, never through a symlink).
# On by default; REQUIRED whenever any enforcement or deception feature is on.
# Every start writes a `startup` record (mode, what armed, this file's path and
# sha256, version) — alert on `status` != none.
audit_path: /var/lib/phage/audit.jsonl

# Seconds an ISOLATED process must stay quiet before it is automatically
# released (graduated de-escalation; at least 1). Frozen processes are never
# auto-released.
release_after: 300

# Acting features. EVERY ONE IS OFF BY DEFAULT and each arms only when
# `mode: enforce` AND its own key below is the literal `true` (yes/on/1 are
# rejected). phaged refuses to start if any of them is true in learn or alert
# mode. They can be enabled ONLY here — no command-line flag can arm them, and
# `-mode` may only lower this file's mode (an emergency `-mode alert` starts
# with them all disarmed and records that). Without this block, enforce mode
# scores and alerts exactly like alert mode — nothing acts.
enforcement:
  isolate: false       # network quarantine: sever egress of a process on a high egress/C2 verdict
  freeze: false        # cgroup-freeze a process tree on a high-confidence verdict (held for `phage thaw`)
  self_heal: false     # restore authorized_keys/cron/ld.so.preload after a malicious write
  self_protect: false  # eBPF-LSM: deny signals that would kill the agent (needs BPF LSM)

# Deception. Creates decoy files on the host (so it is opt-in and announced in
# the startup record) but acts on no process: allowed in alert and enforce.
deception:
  honeytokens: false   # plant decoy credential files; a read of one is a high-confidence alert

# Learning. The baseline is checkpointed while learning (atomic temp file +
# rename), so a crash loses at most one interval; a clean stop also saves it.
# Each feature learns at most max_values_per_key distinct values: a new value
# past the cap is counted (heartbeat baseline_overflow, `phage baseline show`),
# logged once per feature, not learned, and so stays novel.
learn:
  checkpoint_interval: 10m
  max_values_per_key: 10000

# Reporting. Nothing here acts on the host: phaged only writes its own files.
output:
  # One JSON line per verdict at or above thresholds.notify, and one
  # `unlearned` line when an event's whole feature class was never seen while
  # learning, in homelab-next's novelty_finding shape (source_kind heuristic,
  # advisory). Written in alert and enforce mode only. Empty disables it.
  # Opened like the audit trail (0600, never through a symlink); phaged
  # refuses to start if it is set and cannot be opened.
  novelty_path: /var/lib/phage/novelty.jsonl
  # Rotate to novelty.jsonl.1 at this size; 0 = never (use logrotate copytruncate).
  novelty_max_bytes: 67108864
  # A row's uid digests source, profile, status, entity and value with the
  # event's time bucket: a repeat within one bucket is written once.
  novelty_bucket: 1h
  source: phage-host        # the row's `source` (never lake-novelty)
  entity_kind: host         # ip | host | user | domain | process | other
  # entity: web01           # default for kind host: this host's name; set it
  #                         # to the name (or, with entity_kind: ip, the
  #                         # canonical address) your lake profiles use
  # TLP 2.0 label on every row: clear | green | amber | amber+strict | red,
  # exactly. The default is red, which never over-shares but is invisible to
  # a lake reader below red (homelab-next's corroborate reads below red), so
  # set the label you mean.
  tlp: red
  # Seconds between `heartbeat` audit records (events/s, ring-buffer drops,
  # enrichment lag, mode, armed features, baseline sha256), in every mode.
  # A SIEM alerts when they stop (deploy/wazuh/, docs/wazuh.md).
  heartbeat_interval: 60
